name: Android checks
on:
  pull_request:
  push:
    branches: [main, codex/better-intelligence-2-0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BI_TEST_HEAP: 2g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: |
          sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;28.0.12433566' 'cmake;3.22.1'
          chmod +x gradlew
      - name: JVM regressions and release lint
        run: ./gradlew -PbiValidationPackage=true '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' --max-workers=2 --no-configuration-cache :app:testDebugUnitTest :app:lintRelease
      - name: Build real ARM64 CPU and Vulkan libraries
        run: ./gradlew -PbiValidationPackage=true -Pandroid.injected.build.abi=arm64-v8a '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' --max-workers=2 --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
      # A Qualcomm phone is required for runtime execution; CI verifies that the
      # opt-in QNN profile resolves, compiles and packages without changing default builds.
      - name: Build optional Qualcomm QNN validation profile
        run: ./gradlew -PbiValidationPackage=true -PbiQualcommNpu=true -Pandroid.injected.build.abi=arm64-v8a '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' --max-workers=2 --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
